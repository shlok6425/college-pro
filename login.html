<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
     body {
  background: url('https://images.unsplash.com/photo-1611604541730-28a58b0cc88e') no-repeat center center/cover;
  font-family: 'Orbitron', sans-serif;
  margin: 0;
  padding: 0;
  display: flex;
  height: 100vh;
  justify-content: center;
  align-items: center;
}

.login-container {
  background: rgba(0, 0, 0, 0.8);
  padding: 40px;
  border-radius: 15px;
  box-shadow: 0 0 20px limegreen;
  text-align: center;
  color: #fff;
  width: 300px;
}

.login-container .title {
  margin-bottom: 20px;
  font-size: 28px;
}

.login-container input {
  width: 100%;
  padding: 12px;
  margin: 10px 0;
  border: none;
  border-radius: 6px;
  font-size: 16px;
}

.login-container button {
  width: 100%;
  padding: 12px;
  background: rgb(34, 245, 34);
  border: none;
  border-radius: 6px;
  font-size: 16px;
  cursor: pointer;
  transition: background 10s;
}

.login-container button:hover {
  background: #1aff66;
}

#error-message {
  color: red;
  margin-top: 10px;
}
   
    </style>
</head>
<body>
   <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title> Login</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="login-container">
    <h1 class="title">Login</h1>
    <form id="loginForm">
      <input type="text" id="username" placeholder="Username" required />
      <input type="password" id="password" placeholder="Password" required />
      
      <p id="error-message"></p>


      <!-- <tr>Type :</tr> -->
      <input type="radio" name="Type">worker
      <input type="radio" name="Type">user
      <button type="submit" name="login">login</button>
        
     
    </form>
  </div>




</body>
</html>
 
</body>
</html>
